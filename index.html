<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idol Gallery</title>
<meta name="description" content="Every card in the game with its art — searchable by idol, group, set and rarity.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FAF7FB; --surface:#FFFFFF; --surface2:#F3EDF6; --ink:#221A26; --muted:#6E6276;
  --line:#E8E0EC; --accent:#D6336C; --accent-ink:#FFFFFF;
  --r-Common:#868E96; --r-Rare:#1C7ED6; --r-Epic:#7048E8; --r-Legendary:#E8590C;
  --r-Mythic:#E03131; --r-Secret:#0C8599; --r-Exclusive:#099268; --r-Godly:#B8860B;
  --shadow:0 1px 2px rgba(34,26,38,.05),0 4px 14px rgba(34,26,38,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17121B; --surface:#201925; --surface2:#2A2130; --ink:#F2ECF5; --muted:#A294AC;
    --line:#332A3A; --accent:#FF6FA5; --accent-ink:#2B0A18;
    --r-Common:#9BA3AB; --r-Rare:#5CA8EE; --r-Epic:#A78BFA; --r-Legendary:#F5A24A;
    --r-Mythic:#FF7B7B; --r-Secret:#4DC5DB; --r-Exclusive:#51CF9E; --r-Godly:#E7B84C;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#17121B; --surface:#201925; --surface2:#2A2130; --ink:#F2ECF5; --muted:#A294AC;
  --line:#332A3A; --accent:#FF6FA5; --accent-ink:#2B0A18;
  --r-Common:#9BA3AB; --r-Rare:#5CA8EE; --r-Epic:#A78BFA; --r-Legendary:#F5A24A;
  --r-Mythic:#FF7B7B; --r-Secret:#4DC5DB; --r-Exclusive:#51CF9E; --r-Godly:#E7B84C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{max-width:1180px;margin:0 auto;padding:14px 20px 12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.wordmark{font-family:"Bricolage Grotesque","Instrument Sans",sans-serif;font-weight:800;font-size:22px;letter-spacing:-.01em}
.wordmark em{font-style:normal;color:var(--accent)}
.sync{font-size:12.5px;color:var(--muted)}
main{max-width:1180px;margin:0 auto;padding:18px 20px 64px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.toolbar input[type="search"],.toolbar select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 11px;min-width:0}
.toolbar input[type="search"]{flex:1 1 190px}
.count-note{font-size:13px;color:var(--muted);margin:6px 2px 10px;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;padding:1px 7px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.rar{background:color-mix(in srgb,var(--rc) 16%,var(--surface));color:color-mix(in srgb,var(--rc) 72%,var(--ink))}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.gcard .im{aspect-ratio:286/420;width:100%;background:var(--surface2);display:block;object-fit:cover;border:none}
.gcard .gi{padding:8px 10px 10px}
.gcard .gn{font-weight:700;font-size:13.5px;line-height:1.25}
.gcard .gg{font-size:12px;color:var(--muted);margin:1px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .gm{font-size:11px;color:var(--muted);margin-top:5px}
.more{display:block;margin:14px auto 0;padding:8px 22px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.more:hover{border-color:var(--accent);color:var(--accent)}
.sub{color:var(--muted);font-size:13px;margin-top:14px}
.gcard .im.pending{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.gcard .im.pending{animation:none}}
</style>
</head>
<body>
<header><div class="hd">
  <div class="wordmark">IDOL <em>GALLERY</em></div>
  <div class="sync" id="syncNote">Loading…</div>
</div></header>

<main>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search idol, group, or card ID…" aria-label="Search">
    <select id="fGroup" aria-label="Filter by group"><option value="">All groups</option></select>
    <select id="fSet" aria-label="Filter by set"><option value="">All sets</option></select>
    <select id="fRarity" aria-label="Filter by rarity"><option value="">All rarities</option></select>
    <select id="fGender" aria-label="Filter by gender">
      <option value="">All genders</option><option value="F">Girls</option><option value="M">Boys</option><option value="Both">Mixed</option>
    </select>
  </div>
  <div class="count-note" id="count"></div>
  <div class="gal" id="grid"></div>
  <button class="more" id="more" hidden>Show more</button>
  <p class="sub">Every card in the game with its art. Card images are stored alongside this page and load per set as you browse. The full stat database lives in the Idol Census; this page refreshes alongside it when the game is synced.</p>
</main>

<script>
const RARITIES=["Common","Rare","Epic","Legendary","Mythic","Secret","Exclusive","Godly"];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let CARDS=[],SYNCED="";
const SHARDS={};               // set -> {imageId: dataURI} once loaded
const LOADING={};              // set -> Promise
function shard(set){
  if(SHARDS[set])return Promise.resolve(SHARDS[set]);
  if(!LOADING[set])LOADING[set]=fetch("img/"+encodeURIComponent(set)+".json?v="+encodeURIComponent(SYNCED))
    .then(r=>r.ok?r.json():{}).then(m=>(SHARDS[set]=m)).catch(()=>(SHARDS[set]={}));
  return LOADING[set];
}
let shown=96;
function rows(){
  const q=document.getElementById("q").value.trim().toLowerCase();
  const g=document.getElementById("fGroup").value,s=document.getElementById("fSet").value;
  const r=document.getElementById("fRarity").value,gen=document.getElementById("fGender").value;
  return CARDS.filter(c=>{
    if(g&&c[2]!==g)return false;
    if(s&&c[3]!==s)return false;
    if(r&&c[4]!==r)return false;
    if(gen&&c[5]!==gen)return false;
    if(q&&!(c[1].toLowerCase().includes(q)||c[2].toLowerCase().includes(q)||c[0].toLowerCase().includes(q)))return false;
    return true;
  });
}
function render(reset=true){
  if(reset)shown=96;
  const rs=rows();
  document.getElementById("count").textContent=rs.length.toLocaleString()+" of "+CARDS.length.toLocaleString()+" cards";
  const slice=rs.slice(0,shown);
  document.getElementById("grid").innerHTML=slice.map(c=>{
    const src=(SHARDS[c[3]]||{})[c[8]]||"";
    return `<div class="gcard"><img class="im${src?"":" pending"}" loading="lazy" alt="${esc(c[1])}" data-set="${esc(c[3])}" data-img="${esc(c[8])}"${src?` src="${src}"`:""}>`+
      `<div class="gi"><div class="gn">${esc(c[1])}</div><div class="gg">${esc(c[2])}</div>`+
      `<span class="chip rar" style="--rc:var(--r-${c[4]})">${c[4]}</span><div class="gm">${esc(c[0])} · ${esc(c[3])}</div></div></div>`;
  }).join("");
  document.getElementById("more").hidden=rs.length<=shown;
  for(const set of new Set(slice.map(c=>c[3]).filter(s=>!SHARDS[s]))){
    shard(set).then(m=>{
      for(const img of document.querySelectorAll(`img.pending[data-set="${CSS.escape(set)}"]`)){
        const src=m[img.dataset.img]; if(src){img.src=src;} img.classList.remove("pending");
      }
    });
  }
}
fetch("cards.json?v="+Date.now()).then(r=>r.json()).then(d=>{
  CARDS=d.cards; SYNCED=d.synced;
  document.getElementById("syncNote").textContent=CARDS.length.toLocaleString()+" cards · synced "+SYNCED;
  const groups=[...new Set(CARDS.map(c=>c[2]))].sort();
  const sets=[...new Set(CARDS.map(c=>c[3]))].sort();
  document.getElementById("fGroup").innerHTML+=groups.map(g=>`<option>${esc(g)}</option>`).join("");
  document.getElementById("fSet").innerHTML+=sets.map(s=>`<option>${esc(s)}</option>`).join("");
  document.getElementById("fRarity").innerHTML+=RARITIES.map(r=>`<option>${r}</option>`).join("");
  for(const id of["q","fGroup","fSet","fRarity","fGender"])
    document.getElementById(id).addEventListener(id==="q"?"input":"change",()=>render());
  document.getElementById("more").addEventListener("click",()=>{shown+=192;render(false);});
  render();
}).catch(()=>{document.getElementById("syncNote").textContent="Couldn't load cards.json";});
</script>
</body>
</html>
